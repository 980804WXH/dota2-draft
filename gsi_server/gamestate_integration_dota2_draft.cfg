// Dota 2 GSI 配置 —— 放入:
//   Steam\steamapps\common\dota 2 beta\game\dota\cfg\gamestate_integration\
// 文件名需以 gamestate_integration_ 开头、.cfg 结尾，例如本文件。
//
// uri  必须与本地服务器地址一致（默认 127.0.0.1:8765/gsi）
// token 必须与服务器 --token 一致（默认 dota2draft）
// throttle 0.1 = 最快每 0.1s 一次；BP 阶段足够实时。
"dota2_draft_gsi Configuration"
{
    "uri"       "http://127.0.0.1:8765/gsi"
    "timeout"   "5.0"
    "buffer"    "0.1"
    "throttle"  "0.1"
    "heartbeat" "30.0"
    "data"
    {
        "provider"  "1"
        "map"       "1"
        "player"    "1"
        "hero"      "1"
        "draft"     "1"
    }
    "auth"
    {
        "token" "dota2draft"
    }
}
